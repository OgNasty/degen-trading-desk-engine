<style>
  :root { --bg:#05060c; --cyan:#3ee0ff; --green:#3dff9a; --muted:#8d86a8; --line:rgba(90,220,255,.28); --panel:rgba(6,10,18,.78); --ink:#e9f7ff; --pair:rgba(6,10,18,.92); --tick:rgba(5,8,16,.92); --bar:#121824; --gold:#ffc44d; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-x:hidden; }
  body.light { --bg:#eef3f8; --cyan:#0878a8; --green:#0c8f55; --muted:#5c6570; --line:rgba(20,60,90,.2); --panel:rgba(255,255,255,.9); --ink:#14202b; --pair:rgba(255,255,255,.94); --tick:rgba(255,255,255,.94); --bar:#d5dee8; --gold:#b8860b; }
  .scan { pointer-events:none; position:fixed; inset:0; z-index:1; background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(62,224,255,.03) 3px); }
  body.light .scan { background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(8,120,168,.04) 3px); }
  .web { pointer-events:none; position:absolute; left:0; top:0; z-index:4; height:2px; background:linear-gradient(90deg, transparent, rgba(220,235,245,.85)); transform-origin:0 50%; box-shadow:0 0 6px rgba(180,220,255,.6); }
  .web.gold { background:linear-gradient(90deg, transparent, rgba(255,196,77,.96)); box-shadow:0 0 8px rgba(255,196,77,.8); }
  .crumb { position:absolute; left:0; top:0; z-index:7; pointer-events:none; padding:2px 7px; border-radius:999px; border:1px solid rgba(62,224,255,.55); background:rgba(5,10,18,.92); color:#e9f7ff; font-size:11px; white-space:nowrap; box-shadow:0 0 10px rgba(62,224,255,.45); }
  body.light .crumb { background:rgba(255,255,255,.94); color:#14202b; }

  body.light .crumb.gold { color:#8a5a00; }
.spider {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 5;
  width: 42px;
  height: 30px;
  pointer-events: auto;
  cursor: pointer;
  filter: drop-shadow(0 0 8px rgba(62,224,255,.85)) drop-shadow(0 0 4px rgba(255,196,77,.35));
}
.spider .body {
  position: absolute;
  left: 12px;
  top: 9px;
  width: 18px;
  height: 12px;
  border-radius: 35% 45% 40% 50%;
  background: linear-gradient(145deg, #1a2330 0%, #0d141c 40%, #05080e 100%);
  border: 1px solid rgba(62,224,255,.45);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.15), 0 0 12px rgba(62,224,255,.5);
  transition: width .35s ease, height .35s ease, left .35s ease, top .35s ease;
}
.spider.fat .body {
  width: 30px;
  height: 20px;
  left: 6px;
  top: 5px;
  box-shadow: inset 0 1px 3px rgba(255,196,77,.3), 0 0 16px rgba(255,196,77,.75);
  border-color: rgba(255,196,77,.7);
}
.spider.fat {
  filter: drop-shadow(0 0 12px rgba(255,196,77,.9));
}
.spider .eye {
  position: absolute;
  top: 12px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #3ee0ff;
  box-shadow: 0 0 8px #3ee0ff, 0 0 2px #fff;
  transition: left .35s ease, top .35s ease;
}
.spider.above .eye { background: #3dff9a; box-shadow: 0 0 10px #3dff9a, 0 0 3px #fff; }
.spider.below .eye { background: #ff6b81; box-shadow: 0 0 10px #ff6b81, 0 0 3px #fff; }
.spider .eye.l { left: 16px; }
.spider .eye.r { left: 22px; }
.spider.fat .eye { top: 10px; }
.spider.fat .eye.l { left: 12px; }
.spider.fat .eye.r { left: 26px; }
.spider b {
  display: block;
  position: absolute;
  width: 16px;
  height: 2px;
  background: linear-gradient(90deg, #3a4a58, #c8d8e4 60%, #e8f4ff);
  box-shadow: 0 0 4px rgba(62,224,255,.6);
  border-radius: 1px;
}
.spider.fat b { box-shadow: 0 0 6px rgba(255,196,77,.7); }
.spider b.L { left: -2px; transform-origin: 100% 50%; }
.spider b.R { right: -2px; transform-origin: 0 50%; }
.spider b.a { top: 10px; animation: step .28s ease-in-out infinite alternate; }
.spider b.b { top: 14px; animation: step .28s ease-in-out infinite alternate-reverse; }
.spider b.c { top: 18px; animation: step .28s ease-in-out .1s infinite alternate; }
.spider.dance b { animation-duration: .18s; }
.spider.dance b.L.a { --a: -78deg; --b: 18deg; }
.spider.dance b.L.b { --a: -28deg; --b: 28deg; }
.spider.dance b.L.c { --a: 8deg; --b: 70deg; }
.spider.dance b.R.a { --a: 78deg; --b: -18deg; }
.spider.dance b.R.b { --a: 28deg; --b: -28deg; }
.spider.dance b.R.c { --a: -8deg; --b: -70deg; }
.spider b.L.a { --a: -55deg; --b: -20deg; }
.spider b.L.b { --a: -8deg; --b: 16deg; }
.spider b.L.c { --a: 24deg; --b: 52deg; }
.spider b.R.a { --a: 55deg; --b: 20deg; }
.spider b.R.b { --a: 8deg; --b: -16deg; }
.spider b.R.c { --a: -24deg; --b: -52deg; }

@keyframes step {
  from { transform: rotate(var(--a)); }
  to   { transform: rotate(var(--b)); }
}

@media (max-width:900px) {
  .spider,
  .spider.fat {
    filter: none !important;
  }
  .spider .body,
  .spider.fat .body,
  .spider .eye,
  .spider b,
  .spider.fat b {
    box-shadow: none !important;
  }
  .spider .body,
  .spider.fat .body {
    border-color: rgba(62,224,255,.25);
  }
  .spider b {
    animation: none !important;
    transform: rotate(var(--a));
  }
  .spider b.c { display: block; }
  .spider b.L.a { --a: -52deg; }
  .spider b.R.a { --a: 52deg; }
  .spider b.L.b { --a: -12deg; }
  .spider b.R.b { --a: 12deg; }
}
  #reach { position:absolute; left:0; top:0; width:100%; height:100%; z-index:6; pointer-events:none; overflow:visible; }

  .logo-slide { position:absolute; left:0; top:0; z-index:8; pointer-events:none; width:22px; height:22px; margin:0; filter:drop-shadow(0 0 6px rgba(255,196,77,.85)); }

  header, .stats, .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 0 24px rgba(62,224,255,.08); }

  .flash-gold2 { animation:hitGold 1s ease-in-out 2; }

  .flash-red { animation:hitRed 1s ease-in-out 3; }

  .logo { color:var(--cyan); letter-spacing:.08em; font-weight:700; text-shadow:0 0 12px var(--cyan); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }

  .sav-line.sav-sol { color:#3dff9a; }

  .vol-asset .sub { display:flex; justify-content:space-between; gap:8px; }

  .spider b.L.a { --a:-55deg; --b:-20deg; } .spider b.L.b { --a:-8deg; --b:16deg; } .spider b.L.c { --a:24deg; --b:52deg; }

<body>
<div class="scan"></div><div class="web" id="web" hidden></div>
<svg id="reach" aria-hidden="true"><defs>
  <linearGradient id="armGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9b7bff"/><stop offset="45%" stop-color="#f4ffff"/><stop offset="100%" stop-color="#ffc44d"/></linearGradient>

async function rpc(method,params){
  let last=new Error("rpc failed");
  for(const url of RPCS){
    try{
      const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params}),signal:withTimeout(8000)});
      if(!r.ok) throw new Error("rpc "+r.status);
      const data=await r.json();
      if(data.error) throw new Error(data.error.message||"rpc error");
      return data.result;
    }catch(e){ last=e; }
  }
  throw last;
}
async function tokenAmount(owner,mint){

    total+=rows.reduce((s,a)=>{
      const t=a.account&&a.account.data&&a.account.data.parsed&&a.account.data.parsed.info.tokenAmount;
      return s+Number(t&&(t.uiAmountString||t.uiAmount)||0);
    },0);
    if(rows.length) break;

    await pullTo(door.x, door.y, WEB_MS);
    landOn("stats", door);
    const totalElEarly=document.getElementById("totalBal");
    if(totalElEarly && pendingStats){
      const prevTxt=totalElEarly.textContent.replace(/[$,]/g,"");
      const prev=Number(prevTxt);
      const tmp=document.createElement("div");
      tmp.innerHTML=pendingStats;
      const nextEl=tmp.querySelector("#totalBal");
      if(nextEl && Number.isFinite(prev)){
        const nextTxt=nextEl.textContent.replace(/[$,]/g,"");
        const next=Number(nextTxt);
        if(Number.isFinite(next)) balanceDelta=next-prev;
      }
    }
    if(balanceDelta>1) flashColored(statsBox, "flash-green");
    else if(balanceDelta<-1) flashColored(statsBox, "flash-red");
    else flashGold(statsBox);
    const soldLogo=document.querySelector('#stats .asset[data-asset="'+job.sold+'"] svg.mark');
    const boughtLogo=document.querySelector('#stats .asset[data-asset="'+job.bought+'"] svg.mark');
    const slideMs=(LOGO_COUNT-1)*LOGO_GAP+LOGO_TRAVEL;
    if(soldLogo&&boughtLogo){
      const a=pagePoint(soldLogo), b=pagePoint(boughtLogo);
      showWeb(a.x,a.y,b.x,b.y);
      const soldRide=ride(job.sold, a.x, a.y, b.x, b.y, LOGO_TRAVEL);
      const boughtRide=ride(job.bought, b.x, b.y, a.x, a.y, LOGO_TRAVEL);
      tweenAsset(job.sold, job.soldFrom, job.soldTo, slideMs);
      tweenAsset(job.bought, job.boughtFrom, job.boughtTo, slideMs);
      await Promise.race([soldRide.start, boughtRide.start]);
      hideWeb();
    } else {
      tweenAsset(job.sold, job.soldFrom, job.soldTo, slideMs);
      tweenAsset(job.bought, job.boughtFrom, job.boughtTo, slideMs);
    }
    const totalEl=document.getElementById("totalBal");
    if(totalEl){
      const tr=pagePoint(totalEl);
      await walkTo(tr.x, tr.y, 640);
      if(pendingStats){
        const tmp=document.createElement("div");
        tmp.innerHTML=pendingStats;
        const next=tmp.querySelector("#totalBal");
        if(next) totalEl.textContent=next.textContent;
        const sub=statsBox.querySelector(".stat .sub");
        const nextSub=tmp.querySelector(".stat .sub");
        if(sub&&nextSub){ sub.textContent=nextSub.textContent; sub.className=nextSub.className; }
      }
      popNumber(totalEl);
      if(balanceDelta>1) flashColored(statsBox, "flash-green");
      else if(balanceDelta<-1) flashColored(statsBox, "flash-red");
      else flashGold(statsBox);
    }
    const volBox=document.getElementById("volume");
    const vdoor=pointOn("volume", 0.18);
    await pullTo(vdoor.x, vdoor.y, WEB_MS);
    landOn("volume", vdoor);
    flashGold(volBox);
    const pie=document.getElementById("pie");
    const pieCenter=pie?pagePoint(pie):null;
    const volTargets=[];
    const soldVol=volLogo(job.sold);
    const boughtVol=volLogo(job.bought);
    if(soldVol) volTargets.push({name:job.sold, el:soldVol});
    if(boughtVol) volTargets.push({name:job.bought, el:boughtVol});

    if(pieCenter && volTargets.length){
      const rides=volTargets.map(t=>{
        const pt=pagePoint(t.el);
        return ride(t.name, pieCenter.x, pieCenter.y, pt.x, pt.y, LOGO_TRAVEL, LOGO_COUNT, LOGO_GAP);
      });
      volTargets.forEach(t=>{
        const pt=pagePoint(t.el);
        showWeb(pieCenter.x, pieCenter.y, pt.x, pt.y);
      });
      await Promise.race(rides.map(r=>r.start));
      hideWeb();
    }
    const oldCount=document.getElementById("tradeCount");
    const heldCount=oldCount?oldCount.textContent:"";
    if(pendingVol){
      document.getElementById("volume").innerHTML=pendingVol;
      seen.volume=pendingVol;
      pendingVol="";
      const held=document.getElementById("tradeCount");
      if(held) held.textContent=heldCount;
      document.getElementById("volume").querySelectorAll(".vol-asset b").forEach(popNumber);
    }
    const countEl=document.getElementById("tradeCount");
    if(countEl){
      const cr=pagePoint(countEl);
      await walkTo(cr.x, cr.y, 640);
      countEl.textContent=job.count;
      popNumber(countEl);
      flashGold(volBox);
    }
    if(pendingStats){ document.getElementById("stats").innerHTML=pendingStats; seen.stats=pendingStats; pendingStats=""; }
    if(pendingTape){ await unveilTape(pendingTape); pendingTape=""; }
    if(pendingBal){
      await updatePie(pendingBal, pendingPie||seen.pie, {skipStream:true});
      pendingBal=null; pendingPie="";
    }
    pendingVol="";
    drawChart();
    match();
    const back=pointOn("volume", vdoor.u);
    await walkTo(back.x, back.y, 520);
    place(back.x, back.y, back.rot);
    dist=back.u*back.per; edgeU=back.u; lap=laps.indexOf("volume");
  }catch(err){
    hideWeb();
    const path=document.getElementById("reachPath");
    if(path) path.setAttribute("d","");
  }finally{
    ritual=false; tradeJob=null; spider.classList.remove("fat"); hideWeb();
    kickCrawl();
  }
  if(tradeJobs.length){ runTrade(); return; }
  kickCrawl();
  if(queue.length) setTimeout(()=>{ if(!busy()) shootNext(); }, GOLD_GAP);
  else if(deferredPaint) resume();
}
spider.addEventListener("click", e=>{
  e.stopPropagation();
  if(busy()) return;
  dir*=-1;
});
const start=pointOn(laps[lap]); dist=start.u*start.per; edgeU=start.u; place(start.x,start.y,start.rot); requestAnimationFrame(crawl); armIdleShot();
addEventListener("scroll", ()=>{ if(!busy()) reposition(); }, {passive:true});
</script>
</body>
</html>
